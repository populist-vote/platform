openapi: 3.1.0
info:
  title: Populist Election Data API
  version: 1.1.0
  description: |
    Resource-oriented access to Populist elections, races, candidates, reported
    results, and ballot measures. The ballot-by-address operation remains
    available for address-specific election coverage. Results are informational
    and are not an official result certification, sample ballot,
    voter-registration check, polling-place lookup, or statement of voter
    eligibility.
servers:
  - url: /
    description: Relative to the environment base URL supplied during onboarding
security: []
paths:
  /api/v1/elections:
    get:
      operationId: listElections
      summary: List elections
      description: |
        Discovers elections in deterministic election-date and ID order.
        Collection filters are optional and combine with AND semantics.
      parameters:
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/Year"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Paginated elections
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ElectionCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}:
    get:
      operationId: getElection
      summary: Get an election
      description: Returns election metadata for a stable election UUID.
      parameters:
        - $ref: "#/components/parameters/ElectionId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Election found
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ElectionCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}/races:
    get:
      operationId: listElectionRaces
      summary: List races in an election
      description: |
        Returns compact race directory entries with office, party, reporting
        summary, and update time. An existing election with no matching races
        returns an empty collection.
      parameters:
        - $ref: "#/components/parameters/ElectionId"
        - $ref: "#/components/parameters/RaceType"
        - $ref: "#/components/parameters/PoliticalScope"
        - $ref: "#/components/parameters/ElectionScopeFilter"
        - $ref: "#/components/parameters/DistrictTypeFilter"
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/Query"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Paginated election races
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ElectionDataCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}/races/{raceId}:
    get:
      operationId: getElectionRace
      summary: Get a race in an election
      description: |
        Returns the complete public race resource. A race UUID that does not
        belong to the election in the path returns 404.
      parameters:
        - $ref: "#/components/parameters/ElectionId"
        - $ref: "#/components/parameters/RaceId"
        - $ref: "#/components/parameters/EndorserId"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Race found in the election
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ElectionDataCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RaceResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}/results:
    get:
      operationId: listElectionResults
      summary: List lightweight election results
      description: |
        Returns a paginated election-night feed optimized for repeated polling.
        Each item identifies the race and office and includes candidates, vote
        totals, winners, precinct reporting, and its last update time. Null vote
        or reporting values mean data has not been reported; they do not mean
        zero.
      parameters:
        - $ref: "#/components/parameters/ElectionId"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Paginated lightweight results
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ResultsCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElectionResultCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}/ballot-measures:
    get:
      operationId: listElectionBallotMeasures
      summary: List ballot measures in an election
      description: |
        Returns paginated ballot-measure reporting resources for an election.
        This election-wide collection is not filtered to a voting address.
      parameters:
        - $ref: "#/components/parameters/ElectionId"
        - $ref: "#/components/parameters/ElectionScopeFilter"
        - $ref: "#/components/parameters/State"
        - $ref: "#/components/parameters/BallotMeasureStatus"
        - $ref: "#/components/parameters/County"
        - $ref: "#/components/parameters/Municipality"
        - $ref: "#/components/parameters/SchoolDistrict"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Offset"
        - $ref: "#/components/parameters/RequestId"
      responses:
        "200":
          description: Paginated election ballot measures
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/ElectionDataCache"
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallotMeasureCollection"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/v1/elections/{electionId}/ballot:
    post:
      operationId: getBallotByAddress
      summary: Resolve ballot data for an address
      description: |
        Returns election details, ordered races, candidates, reported results,
        ballot measures, and explicit geographic coverage metadata. The optional
        endorserId filters each race's candidate array only.
      parameters:
        - name: electionId
          in: path
          required: true
          description: Election UUID obtained through client configuration.
          schema:
            type: string
            format: uuid
        - name: endorserId
          in: query
          required: false
          description: |
            Organization UUID used to filter candidates to that organization's
            endorsements. Races and results remain present.
          schema:
            type: string
            format: uuid
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        description: JSON request body, limited to 8 KiB.
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BallotRequest"
            examples:
              minneapolis:
                summary: Minnesota address
                value:
                  address:
                    line1: 123 Main St
                    city: Minneapolis
                    state: MN
                    postalCode: "55401"
                    country: US
      responses:
        "200":
          description: Ballot data resolved
          headers:
            X-Request-Id:
              $ref: "#/components/headers/RequestId"
            Cache-Control:
              $ref: "#/components/headers/NoStore"
            Pragma:
              description: Legacy cache-prevention directive.
              schema:
                type: string
                const: no-cache
            X-Content-Type-Options:
              $ref: "#/components/headers/NoSniff"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BallotResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/InvalidAddress"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        "504":
          $ref: "#/components/responses/RequestTimeout"
components:
  parameters:
    ElectionId:
      name: electionId
      in: path
      required: true
      description: Stable election UUID.
      schema:
        type: string
        format: uuid
    RaceId:
      name: raceId
      in: path
      required: true
      description: Stable race UUID. It must belong to the election in the path.
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      required: false
      description: Maximum number of resources to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Offset:
      name: offset
      in: query
      required: false
      description: Number of resources to skip in the deterministic ordering.
      schema:
        type: integer
        minimum: 0
        default: 0
    State:
      name: state
      in: query
      required: false
      description: Two-letter US state or territory code.
      schema:
        $ref: "#/components/schemas/StateCode"
    Year:
      name: year
      in: query
      required: false
      description: Four-digit election year.
      schema:
        type: integer
        minimum: 1788
        maximum: 9999
    Query:
      name: query
      in: query
      required: false
      description: Case-insensitive text search.
      schema:
        type: string
    RaceType:
      name: raceType
      in: query
      required: false
      schema:
        type: string
        enum: [primary, general]
    PoliticalScope:
      name: politicalScope
      in: query
      required: false
      schema:
        type: string
        enum: [local, state, federal]
    ElectionScopeFilter:
      name: electionScope
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/ElectionScope"
    DistrictTypeFilter:
      name: districtType
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/DistrictType"
    BallotMeasureStatus:
      name: status
      in: query
      required: false
      schema:
        $ref: "#/components/schemas/BallotMeasureStatus"
    County:
      name: county
      in: query
      required: false
      description: Exact county name, compared case-insensitively.
      schema:
        type: string
    Municipality:
      name: municipality
      in: query
      required: false
      description: Exact municipality name, compared case-insensitively.
      schema:
        type: string
    SchoolDistrict:
      name: schoolDistrict
      in: query
      required: false
      description: Exact school-district identifier, compared case-insensitively.
      schema:
        type: string
    EndorserId:
      name: endorserId
      in: query
      required: false
      description: |
        Organization UUID used to filter the full race detail's candidate array
        to candidates endorsed by that organization. Results remain unfiltered.
      schema:
        type: string
        format: uuid
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: |
        Caller correlation ID. Values longer than 128 bytes or invalid as an
        HTTP header value are replaced. Do not include personal data.
      schema:
        type: string
        maxLength: 128
  headers:
    RequestId:
      description: Caller-supplied or server-generated request correlation ID.
      schema:
        type: string
    NoStore:
      description: Prevents storage of address-derived responses.
      schema:
        type: string
        const: no-store
    ElectionCache:
      description: |
        Election discovery metadata can be cached for five minutes and served
        stale while it is asynchronously revalidated.
      schema:
        type: string
        const: public, max-age=300, stale-while-revalidate=900
    ElectionDataCache:
      description: |
        Race and ballot-measure resources can be cached for one minute and
        served stale while they are asynchronously revalidated.
      schema:
        type: string
        const: public, max-age=60, stale-while-revalidate=300
    ResultsCache:
      description: |
        Results can be cached for five seconds and served briefly stale while
        they are asynchronously revalidated.
      schema:
        type: string
        const: public, max-age=5, stale-while-revalidate=25
    NoSniff:
      description: Disables MIME-type sniffing.
      schema:
        type: string
        const: nosniff
    RetryAfter:
      description: Minimum retry delay in seconds.
      schema:
        type: string
        const: "5"
  responses:
    BadRequest:
      description: Invalid path parameter, query parameter, or JSON body
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            invalidBody:
              value:
                type: about:blank
                title: Bad Request
                status: 400
                code: invalid_body
                detail: The JSON request body is invalid.
                instance: /api/v1/elections/not-a-uuid/ballot
    NotFound:
      description: Requested election or race does not exist in this resource path
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MethodNotAllowed:
      description: HTTP method is not supported
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: Request body exceeds 8 KiB
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    UnsupportedMediaType:
      description: Content-Type is not application/json
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvalidAddress:
      description: Address fields are invalid or the address cannot be resolved
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          example:
            type: about:blank
            title: Unprocessable Entity
            status: 422
            code: invalid_address
            detail: The address could not be resolved to a voting location.
            instance: /api/v1/elections/7f7f1111-2222-4333-8444-555555555555/ballot
    RateLimited:
      description: Server ballot-lookup capacity is exhausted
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InternalError:
      description: Unexpected application or database failure
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    ServiceUnavailable:
      description: Address service is temporarily unavailable
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    RequestTimeout:
      description: Ballot lookup exceeded its application deadline
      headers:
        X-Request-Id:
          $ref: "#/components/headers/RequestId"
        Cache-Control:
          $ref: "#/components/headers/NoStore"
        X-Content-Type-Options:
          $ref: "#/components/headers/NoSniff"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    StateCode:
      type: string
      enum:
        - AL
        - AK
        - AS
        - AZ
        - AR
        - CA
        - CO
        - CT
        - DC
        - FM
        - DE
        - FL
        - GA
        - GU
        - HI
        - ID
        - IL
        - IN
        - IA
        - KS
        - KY
        - LA
        - ME
        - MH
        - MD
        - MA
        - MI
        - MN
        - MS
        - MO
        - MT
        - NE
        - NV
        - NH
        - NJ
        - NM
        - NY
        - NC
        - ND
        - MP
        - OH
        - OK
        - OR
        - PW
        - PA
        - PR
        - RI
        - SC
        - SD
        - TN
        - TX
        - UT
        - VT
        - VI
        - VA
        - WA
        - WV
        - WI
        - WY
    PaginationMeta:
      type: object
      additionalProperties: false
      required: [count, total, limit, offset]
      properties:
        count:
          type: integer
          minimum: 0
          description: Number of resources in this response.
        total:
          type: integer
          minimum: 0
          description: Total resources matching the filters.
        limit:
          type: integer
          minimum: 1
          maximum: 100
        offset:
          type: integer
          minimum: 0
    ElectionCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ElectionMetadata"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    ElectionResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/ElectionMetadata"
    RaceCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/RaceSummary"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    RaceResponse:
      type: object
      additionalProperties: false
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/RaceDetail"
    ElectionResultCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ElectionResult"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    BallotMeasureCollection:
      type: object
      additionalProperties: false
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/BallotMeasureReporting"
        meta:
          $ref: "#/components/schemas/PaginationMeta"
    BallotRequest:
      type: object
      additionalProperties: false
      required:
        - address
      properties:
        address:
          $ref: "#/components/schemas/Address"
    Address:
      type: object
      additionalProperties: false
      required:
        - line1
        - city
        - state
        - postalCode
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type:
            - string
            - "null"
          maxLength: 200
          description: Accepted but intentionally ignored for geocoding and storage.
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          pattern: '^[A-Za-z]{2}$'
          description: Case-insensitive valid US state or territory code.
        postalCode:
          type: string
          pattern: '^[0-9]{5}(-[0-9]{4})?$'
        country:
          type:
            - string
            - "null"
          default: US
          description: Case-insensitive US or USA; normalized to US.
          pattern: '^[Uu][Ss]([Aa])?$'
    BallotResponse:
      type: object
      additionalProperties: false
      required:
        - data
      properties:
        data:
          $ref: "#/components/schemas/BallotData"
    BallotData:
      type: object
      additionalProperties: false
      required:
        - election
        - races
        - ballotMeasures
        - coverage
      properties:
        election:
          $ref: "#/components/schemas/Election"
        races:
          type: array
          items:
            $ref: "#/components/schemas/Race"
        ballotMeasures:
          type: array
          items:
            $ref: "#/components/schemas/BallotMeasure"
        coverage:
          $ref: "#/components/schemas/Coverage"
    CoverageLevel:
      type: string
      enum:
        - address_specific
        - statewide_only
    Coverage:
      type: object
      additionalProperties: false
      required:
        - races
        - ballotMeasures
        - warnings
      properties:
        races:
          $ref: "#/components/schemas/CoverageLevel"
        ballotMeasures:
          $ref: "#/components/schemas/CoverageLevel"
        warnings:
          type: array
          items:
            type: string
    Election:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - description
        - state
        - electionDate
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type:
            - string
            - "null"
        state:
          oneOf:
            - $ref: "#/components/schemas/StateCode"
            - type: "null"
        electionDate:
          type: string
          format: date
    ElectionMetadata:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - title
        - description
        - state
        - municipality
        - electionDate
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        description:
          type: [string, "null"]
        state:
          oneOf:
            - $ref: "#/components/schemas/StateCode"
